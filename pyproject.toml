[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ttula"
version = "0.1.0"
description = "Kali-native security reconnaissance workspace — Web Crawler, Arsenal-NG cheats, Tookie OSINT, Uro URL filtering, Legba auth testing, and Tailscale lab connectivity"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Aarush Rahul Patel" },
    { name = "Shreya Singh" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pyyaml>=6.0",
    "textual>=0.50.0",
    "streamlit>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
ttula = "ttula.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ttula*"]

[tool.setuptools.package-data]
"ttula.integrations.arsenal" = ["cheats/*.yaml", "cheats/*.yml"]
"ttula.ui.streamlit" = ["*.py"]

[tool.setuptools.data-files]
# Include the full Arsenal-NG community cheat knowledge base at the repo root
"share/ttula/cheat-files" = []
