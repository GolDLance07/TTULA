[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ttula"
version = "0.1.0"
description = "Personal Kali-native security operations orchestration tool connecting Arsenal-NG, Tookie, Uro, and Legba over Tailscale"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "TTULA Security Operations" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pyyaml>=6.0",
    "textual>=0.50.0",
    "streamlit>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
ttula = "ttula.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ttula*"]

[tool.setuptools.package-data]
"ttula.integrations.arsenal" = ["cheats/*.yaml", "cheats/*.yml"]
"ttula.ui.streamlit" = ["*.py"]
